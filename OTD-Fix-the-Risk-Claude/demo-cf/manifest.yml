applications:
  - name: otd-fix-the-risk-ui
    memory: 64M
    disk_quota: 128M
    instances: 1
    buildpacks:
      - staticfile_buildpack
    # Static demo chat UI for the OTD-Fix-the-Risk agent. Talks to the A2A
